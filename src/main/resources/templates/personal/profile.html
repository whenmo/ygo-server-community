<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資料</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/sweetalert.css}" href="/css/sweetalert.css">
    <link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css">

    <script th:src="@{/js/common/vue.global.prod.js}" src="/js/common/vue.global.prod.js"></script>
    <script th:src="@{/js/common/axios.min.js}" src="/js/common/axios.min.js"></script>
    <script th:src="@{/js/common/sweetalert2.all.min.js}" src="/js/common/sweetalert2.all.min.js"></script>
    <script th:src="@{/js/common/navbar.js}" src="/js/common/navbar.js"></script>

    <script th:src="@{/js/api/userHelper.js}" src="/js/api/userHelper.js"></script>

    <style>
        .profile-title {
            color: var(--red-color);
            font-weight: bold;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--red-color);
        }

        .profile-settings {
            max-width: 760px;
            border: 1px solid var(--brown-color);
            border-radius: 5px;
            background: var(--white-color);
        }

        .profile-setting-row {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) minmax(0, 3fr) auto;
            align-items: center;
            padding: 5px 10px;
        }

        .profile-setting-row+.profile-setting-row {
            border-top: 1px solid var(--brown-hover);
        }

        .profile-setting-label {
            color: var(--brown-color);
            font-weight: bold;
        }

        .profile-setting-value {
            color: var(--red-color);
            font-size: 1.15rem;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .profile-setting-muted {
            color: var(--brown-color);
            font-family: monospace;
            font-size: 1rem;
        }

        @media (max-width: 640px) {
            .profile-setting-row {
                grid-template-columns: 1fr auto;
                gap: 10px;
            }

            .profile-setting-label {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: navbar('personal')}"></div>

    <main id="app" class="main-one-col-layout">

        <h2 class="profile-title">個人資料</h2>

        <section class="profile-settings">
            <div class="profile-setting-row">
                <span class="profile-setting-label">顯示名稱</span>
                <strong class="profile-setting-value">{{ displayName }}</strong>
                <button type="button" class="module-btn" :disabled="isSubmitting" @click="editName">
                    修改名稱
                </button>
            </div>
            <div class="profile-setting-row">
                <span class="profile-setting-label">登入密碼</span>
                <span class="profile-setting-muted">********</span>
                <button type="button" class="module-btn" :disabled="isSubmitting" @click="editPassword">
                    修改密碼
                </button>
            </div>
        </section>
    </main>

    <script th:inline="javascript">
        const { createApp, ref } = Vue;
        const initialUser = /*[[${user}]]*/ null;

        const classicalSwal = Swal.mixin({
            customClass: {
                popup: 'swal-popup',
                title: 'swal-title'
            },
            buttonsStyling: true
        });

        const extractErrorMessage = (error, fallback) => {
            const data = error?.response?.data;
            if (!data) return fallback;
            if (typeof data === 'string' && data.trim()) return data;
            if (data.message) return data.message;
            if (Array.isArray(data.errors) && data.errors.length > 0) {
                return data.errors[0].defaultMessage || data.errors[0].message || fallback;
            }
            return fallback;
        };

        createApp({
            setup() {
                const displayName = ref(initialUser?.name ?? '');
                const isSubmitting = ref(false);

                const { updateProfileInfo, updateProfilePassword } = window.useUserHelper();

                const editName = async () => {
                    if (isSubmitting.value) return;

                    const result = await classicalSwal.fire({
                        title: '修改顯示名稱',
                        input: 'text',
                        inputLabel: '新名稱',
                        inputValue: displayName.value,
                        inputAutoTrim: true,
                        showCancelButton: true,
                        confirmButtonText: '儲存',
                        cancelButtonText: '取消',
                        preConfirm: (value) => {
                            const trimmed = (value || '').trim();
                            if (!trimmed) {
                                Swal.showValidationMessage('用戶名稱不可為空');
                                return false;
                            }
                            if (trimmed === displayName.value) {
                                Swal.showValidationMessage('新名稱與目前名稱相同');
                                return false;
                            }
                            return trimmed;
                        }
                    });

                    if (!result.isConfirmed) return;

                    isSubmitting.value = true;
                    try {
                        const updatedUser = await updateProfileInfo({ name: result.value });
                        displayName.value = updatedUser?.name ?? result.value;
                        await classicalSwal.fire({
                            icon: 'success',
                            title: '名稱已更新',
                            timer: 1200,
                            showConfirmButton: false
                        });
                    } catch (error) {
                        await classicalSwal.fire({
                            icon: 'error',
                            title: '更新失敗',
                            text: extractErrorMessage(error, '無法更新顯示名稱')
                        });
                    } finally {
                        isSubmitting.value = false;
                    }
                };

                const editPassword = async () => {
                    if (isSubmitting.value) return;

                    const result = await classicalSwal.fire({
                        title: '修改密碼',
                        html: `
                            <div class="swal-row-container">
                                <fieldset class="module-fieldset">
                                    <legend>舊密碼</legend>
                                    <input id="swal-old-password" class="module-input-clean" type="password" autocomplete="current-password">
                                </fieldset>
                                <fieldset class="module-fieldset">
                                    <legend>新密碼</legend>
                                    <input id="swal-new-password" class="module-input-clean" type="password" autocomplete="new-password">
                                </fieldset>
                                <fieldset class="module-fieldset">
                                    <legend>再次輸入新密碼</legend>
                                    <input id="swal-confirm-password" class="module-input-clean" type="password" autocomplete="new-password">
                                </fieldset>
                            </div>
                        `,
                        showCancelButton: true,
                        confirmButtonText: '更新密碼',
                        cancelButtonText: '取消',
                        preConfirm: () => {
                            const oldPassword = document.getElementById('swal-old-password').value;
                            const newPassword = document.getElementById('swal-new-password').value;
                            const confirmPassword = document.getElementById('swal-confirm-password').value;

                            if (!oldPassword) {
                                Swal.showValidationMessage('舊密碼不可為空');
                                return false;
                            }
                            if (!newPassword) {
                                Swal.showValidationMessage('新密碼不可為空');
                                return false;
                            }
                            if (!confirmPassword) {
                                Swal.showValidationMessage('請再次輸入新密碼');
                                return false;
                            }
                            if (newPassword !== confirmPassword) {
                                Swal.showValidationMessage('兩次輸入的新密碼不一致');
                                return false;
                            }
                            if (newPassword === oldPassword) {
                                Swal.showValidationMessage('新密碼不可與舊密碼相同');
                                return false;
                            }
                            return { oldPassword, newPassword };
                        }
                    });

                    if (!result.isConfirmed) return;

                    isSubmitting.value = true;
                    try {
                        await updateProfilePassword(result.value);
                        await classicalSwal.fire({
                            icon: 'success',
                            title: '密碼已更新',
                            timer: 1200,
                            showConfirmButton: false
                        });
                    } catch (error) {
                        await classicalSwal.fire({
                            icon: 'error',
                            title: '更新失敗',
                            text: extractErrorMessage(error, '無法更新密碼')
                        });
                    } finally {
                        isSubmitting.value = false;
                    }
                };

                return {
                    displayName,
                    isSubmitting,
                    editName,
                    editPassword
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
