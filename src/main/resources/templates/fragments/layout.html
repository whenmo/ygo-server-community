<!DOCTYPE html>
<html lang="zh-Hans" xmlns:th="http://www.thymeleaf.org">

<body>
    <!-- 頂部導覽列 Header Fragment -->
    <header th:fragment="navbar" class="site-navbar">
        <!-- Logo / Title 區塊 -->
        <a class="nav-home" th:href="@{/}" href="/">
            <span class="home-text">翼龍服社區</span>
        </a>

        <!-- 導覽連結與登入狀態判定 -->
        <ul class="nav-links">
            <!-- 1. 已登入狀態 -->
            <th:block th:if="${currentUser != null and !#strings.isEmpty(currentUser)}">
                <li><a th:href="@{/view/cards}" href="/view/cards">卡片搜索</a></li>
                <li><a th:href="@{/view/decks}" href="/view/decks">公開卡組</a></li>
                <li><a th:href="@{/personal/profile}" href="/personal/profile">個人主頁</a></li>
                <th:block th:if="${isAdmin != null and isAdmin}">
                    <li><a th:href="@{/admin/cdb}" href="/admin/cdb">管理員後台</a></li>
                </th:block>
            </th:block>

            <!-- 2. 未登入狀態 -->
            <th:block th:unless="${currentUser != null and !#strings.isEmpty(currentUser)}">
                <li><a th:href="@{/view/cards}" href="/view/cards">卡片搜索</a></li>
                <li><a th:href="@{/view/decks}" href="/view/decks">公開卡組</a></li>
                <li><a th:href="@{/auth/login}" href="/auth/login" class="nav-btn">登入</a></li>
            </th:block>
        </ul>
    </header>
</body>

</html>
