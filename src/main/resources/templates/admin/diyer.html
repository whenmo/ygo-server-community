<!DOCTYPE html>
<html lang="zh-Hans" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員設定 - 作者清單</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/sweetalert.css}" href="/css/sweetalert.css">
    <link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css">
    <link rel="stylesheet" th:href="@{/css/pageHelper.css}" href="/css/pageHelper.css">

    <script th:src="@{/js/common/axios.min.js}" src="/js/common/axios.min.js"></script>
    <script th:src="@{/js/common/vue.global.prod.js}" src="/js/common/vue.global.prod.js"></script>
    <script th:src="@{/js/common/sweetalert2.all.min.js}" src="/js/common/sweetalert2.all.min.js"></script>

    <script th:src="@{/js/common/navbar.js}" src="/js/common/navbar.js"></script>
    <script th:src="@{/js/common/pageHelper.js}" src="/js/common/pageHelper.js"></script>
    <script th:src="@{/js/api/cdbHelper.js}" src="/js/api/cdbHelper.js"></script>
    <script th:src="@{/js/api/diyerHelper.js}" src="/js/api/diyerHelper.js"></script>
    <script th:src="@{/js/api/cdbConfigHelper.js}" src="/js/api/cdbConfigHelper.js"></script>

    <style>
        .main-layout {
            height: calc(100vh - 60px);
            padding: 20px 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .top-title {
            background: transparent;
            border-bottom: 2px solid var(--red-color);
            padding-bottom: 10px;
            margin-bottom: 10px;
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-title>h2 {
            font-size: 1.5rem;
            color: var(--red-color);
            margin: 0;
            font-variant: small-caps;
        }
    </style>

    <style>
        .table-item-name {
            color: var(--red-color);
            font-weight: bold;
        }

        .table-item-hint-label {
            color: var(--brown-hover);
            font-weight: bold;
        }

        .table-item-settype {
            color: var(--brown-hover);
            font-weight: bold;
            text-align: center;
            width: 1%;
            background-color: var(--white-hover) !important;
        }

        .table-item-setcode {
            color: var(--dark-color);
            font-weight: bold;
            background-color: var(--white-hover) !important;
        }

        .table-item-setname {
            color: var(--red-color);
            font-weight: bold;
            background-color: var(--white-hover) !important;
        }

        /* 區間標籤樣式 */
        .diyer-keylabel-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .diyer-keylabel {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 5px 10px;
            color: var(--white-color);
            background-color: var(--dark-color);
            border-radius: 5px;
            border: 0;
        }

        /* 主表格與欄位樣式 */
        .table-row-diyer-info {
            cursor: pointer;
        }

        .table-row-diyer-info td {
            border-top: 1px solid var(--brown-hover);
        }

        /* 展開指示圖示 */
        .expand-icon {
            display: inline-block;
            transition: transform 0.2s;
            margin-right: 6px;
            font-weight: bold;
        }

        .expand-icon.is-expanded {
            transform: rotate(90deg);
        }
    </style>

    <style>
        /* SweetAlert2 編輯器彈窗樣式 */
        .swal-add-fieldset {
            width: auto;
            justify-content: space-between;
            flex-direction: row;
        }

        .swal-add-fieldset input {
            width: 100%;
        }

        .swal-add-fieldset button {
            padding: 8px 10px;
        }

        .swal-editor-body td {
            padding: 5px;
            border-bottom: 1px solid var(--brown-hover);
        }

        .swal-editor-body tr:last-child {
            border-bottom: none;
        }

        .swal-editor-row input {
            width: 100%;
            padding: 5px 0 !important;
            border-bottom: 2px solid var(--brown-color);
        }

        .swal-editor-row input:focus {
            border-bottom: 2px solid var(--red-color);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: navbar('admin')}"></div>

    <main id="app" class="main-layout">
        <!-- 頂部工具列 -->
        <div class="top-title">
            <h2>作者清單</h2>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
                <select v-model.number="pageSize" class="module-select" style="width: auto;">
                    <option v-for="size in pageSizeOptions" :key="size" :value="size">{{ size }} 筆/頁</option>
                </select>
                <select v-model.number="selectedCdbId" @change="getCurrentDiyer" class="module-select">
                    <option v-for="config in cdbConfigs" :key="config.id" :value="config.id">
                        {{ config.name }}
                    </option>
                </select>
                <button type="button" @click="exportConfig" class="module-btn" :disabled="!selectedCdbId">匯出</button>
                <button type="button" @click="openDiyerModal()" class="module-btn">新增作者</button>
            </div>
        </div>

        <!-- 作者資料表格 -->
        <div class="module-table-container">
            <table class="module-table">
                <thead>
                    <tr>
                        <th>作者</th>
                        <th>字段區間</th>
                        <th>卡號區間</th>
                        <th style="text-align: center;">操作</th>
                    </tr>
                    <tr>
                        <th>類型</th>
                        <th>code</th>
                        <th colspan="2">名稱</th>
                    </tr>
                </thead>

                <tbody v-if="!loaded">
                    <tr>
                        <td colspan="4" class="table-item-empty-row">載入中...</td>
                    </tr>
                </tbody>
                <tbody v-else-if="sortedDiyers.length === 0">
                    <tr>
                        <td colspan="4" class="table-item-empty-row">目前尚無作者資料</td>
                    </tr>
                </tbody>

                <!-- 作者列表與展開子項目 -->
                <tbody v-else>
                    <template v-for="diyer in pagedItems" :key="diyer.id">
                        <!-- 作者主列 -->
                        <tr class="table-row-diyer-info" @click="toggleDiyerRow(diyer.id)">
                            <td style="width: 1%;">
                                <div style="display: flex;">
                                    <span class="expand-icon"
                                        :class="{ 'is-expanded': expandDiyerIds.has(diyer.id) }">▶</span>
                                    <p class="table-item-name">{{ diyer.name }}</p>
                                </div>
                            </td>
                            <td>
                                <div class="diyer-keylabel-container">
                                    <span v-if="!diyer.setRanges?.length" class="table-item-hint-label">未申請</span>
                                    <span v-for="range in sortNumbers(diyer.setRanges)" :key="range"
                                        class="diyer-keylabel">
                                        {{ formatHex2(range) }}
                                    </span>
                                </div>
                            </td>
                            <td>
                                <div class="diyer-keylabel-container">
                                    <span v-if="!diyer.codeRanges?.length" class="table-item-hint-label">未申請</span>
                                    <span v-for="code in sortNumbers(diyer.codeRanges)" :key="code"
                                        class="diyer-keylabel">
                                        {{ code }}
                                    </span>
                                </div>
                            </td>
                            <td class="table-item-center">
                                <button type="button" class="module-btn" @click="openDiyerModal(diyer)">編輯</button>
                            </td>
                        </tr>

                        <!-- 展開的子字串列表 -->
                        <template v-if="expandDiyerIds.has(diyer.id)">
                            <tr v-if="getSortedDiyerStrings(diyer).length === 0">
                                <td colspan="4" class="table-item-empty-row">
                                    作者未在此 CDB 申請字段 / 指示物 / 特殊勝利
                                </td>
                            </tr>
                            <tr v-for="entry in getSortedDiyerStrings(diyer)" :key="`${entry.type}-${entry.code}`">
                                <td class="table-item-settype">{{ getTypeLabel(entry.type) }}</td>
                                <template v-if="entry.type === 'hint'">
                                    <td class="table-item-setname" colspan="3">{{ entry.name }}</td>
                                </template>
                                <template v-else>
                                    <td class="table-item-setcode">{{ entry.code != null ? '0x' +
                                        Number(entry.code).toString(16).toUpperCase() : '-' }}</td>
                                    <td class="table-item-setname" colspan="2">{{ entry.name }}</td>
                                </template>
                            </tr>
                        </template>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- 底部分頁選擇器 -->
        <div class="result-page-row" style="flex-shrink: 0; margin-top: auto;">
            <button type="button" @click="previousPage" :disabled="currentPage === 1">上一頁</button>
            <span>
                <input class="module-input-clean" :value="currentPage" @input="onPageInput" @blur="validatePage" />
                / {{ totalPages }}
            </span>
            <button type="button" @click="nextPage" :disabled="currentPage === totalPages">下一頁</button>
        </div>
    </main>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        const classicalSwal = Swal.mixin({
            customClass: {
                popup: 'swal-popup',
                title: 'swal-title'
            },
            buttonsStyling: true
        });

        createApp({
            setup() {
                const { loadDefaultStrings } = window.useCdbHelper();
                const { loadDiyersByCdbId, createDiyer, updateDiyer, deleteDiyer } = window.useDiyerHelper();
                const { loadAllConfigs } = window.useCdbConfigHelper();

                const loaded = ref(false);
                const defaultStrings = ref({ setnames: [], counters: [], victorys: [] });
                const cdbConfigs = ref([]);
                const selectedCdbId = ref(null);
                const diyers = ref([]);

                const expandDiyerIds = ref(new Set());

                // 依據最小卡號區間與名稱排序作者清單
                const sortedDiyers = computed(() => [...diyers.value].sort((left, right) => {
                    const leftMin = Math.min(...(left.codeRanges || []).map(Number));
                    const rightMin = Math.min(...(right.codeRanges || []).map(Number));
                    const leftVal = Number.isFinite(leftMin) ? leftMin : Number.POSITIVE_INFINITY;
                    const rightVal = Number.isFinite(rightMin) ? rightMin : Number.POSITIVE_INFINITY;
                    return (leftVal - rightVal) || left.name.localeCompare(right.name);
                }));

                // 分頁控制 (來自 pageHelper.js)
                const {
                    pageSizeOptions,
                    pageSize,
                    currentPage,
                    totalPages,
                    pagedCards: pagedItems,
                    previousPage,
                    nextPage,
                    onPageInput,
                    validatePage
                } = window.usePageHelper(sortedDiyers, 10);

                // =========================================================================
                // 2. 通用格式化與排序工具函式
                // =========================================================================

                /** 將數值格式化為 2 位數的大寫十六進位字串 */
                const formatHex2 = val => Number(val).toString(16).toUpperCase().padStart(2, '0');

                /** 將特殊字元跳脫以防範 HTML 注入 */
                const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
                })[ch]);

                /** 將數字陣列進行由小到大的排序 */
                const sortNumbers = values => [...(values || [])].sort((a, b) => Number(a) - Number(b));

                /** 取得字串型別對應的中文標籤 */
                const getTypeLabel = type => ({
                    setname: '字段',
                    counter: '指示物',
                    victory: '特殊勝利',
                    hint: '提示'
                }[type] || type);

                /** 依照 Yu-Gi-Oh! 字段代碼規則進行排序 */
                const sortSetnames = (left, right) => {
                    /** 解析字段代碼的十六進位結構以供進階排序 */
                    const parseKeys = code => {
                        const hex = String(code != null ? Number(code).toString(16) : '').toUpperCase().padStart(4, '0');
                        return {
                            first: Number.parseInt(hex[1] + hex[2], 16) || 0,
                            second: Number.parseInt(hex[0], 16) || 0,
                            third: Number.parseInt(hex[3], 16) || 0,
                            full: Number.parseInt(hex, 16) || 0
                        };
                    };
                    const l = parseKeys(left.code);
                    const r = parseKeys(right.code);
                    return (l.first - r.first) || (l.second - r.second) || (l.third - r.third) || (l.full - r.full);
                };

                /** 依照中文筆畫/字串順序排序提示內容 */
                const sortHints = (left, right) => String(left.name).localeCompare(String(right.name), 'zh-Hant');

                /** 依照數值大小排序指示物或特殊勝利 */
                const sortCountersOrVictories = (left, right) => {
                    const lNum = Number(left.code) || 0;
                    const rNum = Number(right.code) || 0;
                    return lNum - rNum;
                };

                /** 取得並淺拷貝作者底下的所有字串設定 */
                const getCdbStrings = diyer => (diyer.strings || []).map(item => ({ ...item }));

                /** 取得並依特定優先權與規則排序作者的所有字串設定 */
                const getSortedDiyerStrings = diyer => {
                    const weights = { setname: 1, counter: 2, victory: 3, hint: 4 };
                    return getCdbStrings(diyer).sort((left, right) => {
                        const diff = (weights[left.type] || 5) - (weights[right.type] || 5);
                        if (diff !== 0) return diff;
                        if (left.type === 'setname') return sortSetnames(left, right);
                        if (left.type === 'counter' || left.type === 'victory') return sortCountersOrVictories(left, right);
                        return sortHints(left, right);
                    });
                };

                // =========================================================================
                // 3. API 資料載入與頁面狀態交互
                // =========================================================================

                /** 切換作者列表主列的展開與收合狀態 */
                const toggleDiyerRow = (diyerId) => {
                    const nextSet = new Set(expandDiyerIds.value);
                    nextSet.has(diyerId) ? nextSet.delete(diyerId) : nextSet.add(diyerId);
                    expandDiyerIds.value = nextSet;
                };

                /** 統一顯示錯誤訊息的 SweetAlert2 提示框 */
                const throwErrorSwal = (title, text, error) => classicalSwal.fire({
                    icon: 'error',
                    title,
                    text: error?.response?.data?.message || text
                });

                // =========================================================================
                // 4. 表單資料驗證、解析與重複檢查
                // =========================================================================

                /** 驗證並將十六進位或十進位字串轉換為 10 進位代碼數字 */
                const checkCodeValue = (rawCode, type) => {
                    if (type === 'hint') return null;
                    const trimmed = String(rawCode || '').trim();
                    if (!trimmed) return null;

                    const hexCode = trimmed.replace(/^0x/i, '').toUpperCase();
                    if (!/^[0-9a-f]+$/i.test(hexCode)) return null;

                    const numericValue = Number.parseInt(hexCode, 16);
                    if (isNaN(numericValue) || numericValue < 1 || numericValue > 65535) return null;

                    return numericValue;
                };

                /** 解析單行組態字串（如 !setname, !counter, !victory, !hint 或 # 註解） */
                const matchStringLine = line => {
                    if (line.startsWith('#')) {
                        const content = line.slice(1).trim();
                        if (!content) return null;
                        return { type: 'hint', code: null, name: content };
                    }

                    if (line.startsWith('!')) {
                        const matchType = line.match(/^!(setname|counter|victory|hint)\s+/);
                        if (!matchType) return null;

                        const type = matchType[1];
                        const remainder = line.slice(matchType[0].length).trim();

                        if (type === 'hint') {
                            if (!remainder) return null;
                            return { type: 'hint', code: null, name: remainder };
                        }

                        const spaceIdx = remainder.indexOf(' ');
                        if (spaceIdx === -1) return null;

                        const code = checkCodeValue(remainder.slice(0, spaceIdx), type);
                        const name = remainder.slice(spaceIdx + 1).trim();
                        return (code !== null && name) ? { type, code, name } : null;
                    }
                    return null;
                };

                /** 解析整段多行的匯入文字內容並轉為結構化陣列與作者詮釋資料 */
                const parseStringImport = content => {
                    const entries = [];
                    let diyerMeta = null;

                    content.replace(/^\uFEFF/, '').split(/\r?\n/).forEach(rawLine => {
                        const line = rawLine.trim();
                        if (!line) return;

                        // 解析 !diyer 作者名稱(空格)卡號區間(,分隔)(空格)0x字段區間(,分隔)
                        if (line.startsWith('!diyer')) {
                            const remainder = line.slice(6).trim();
                            const parts = remainder.split(/\s+/);
                            let name = '';
                            let codeRanges = [];
                            let setRanges = [];
                            let lastIdx = parts.length - 1;

                            if (lastIdx >= 0 && parts[lastIdx].toLowerCase().includes('0x')) {
                                setRanges = parts[lastIdx].replace(/^0x/i, '').split(',').map(s => Number.parseInt(s.trim(), 16)).filter(n => !isNaN(n));
                                lastIdx--;
                            }
                            if (lastIdx >= 0 && /^[0-9,\-]+$/.test(parts[lastIdx])) {
                                codeRanges = parts[lastIdx].split(',').map(s => Number.parseInt(s.trim(), 10)).filter(n => !isNaN(n));
                                lastIdx--;
                            }
                            if (lastIdx >= 0) {
                                name = parts.slice(0, lastIdx + 1).join(' ');
                            } else if (!name && parts.length > 0) {
                                name = remainder;
                            }

                            diyerMeta = { name, codeRanges, setRanges };
                            return;
                        }

                        const entry = matchStringLine(line);
                        if (entry) entries.push(entry);
                    });
                    return { entries, diyerMeta };
                };

                /** 檢查項目是否與系統預設字串配置發生衝突 */
                const isConflictWithDefault = (type, code, name) => {
                    if (!defaultStrings.value) return false;
                    if (type === 'setname') {
                        return (defaultStrings.value.setnames || []).some(s => Number(s.code) === Number(code) || s.name === name);
                    }
                    if (type === 'counter') {
                        return (defaultStrings.value.counters || []).some(c => Number(c.code) === Number(code) || c.name === name);
                    }
                    if (type === 'victory') {
                        return (defaultStrings.value.victorys || []).some(v => Number(v.code) === Number(code) || v.name === name);
                    }
                    return false;
                };

                /** 收集表單中的所有衝突與驗證錯誤供詳細面板顯示 */
                const collectConflicts = (form, currentDiyerId) => {
                    const conflictItems = [];

                    form.rows.forEach((row, index) => {
                        const isHint = row.type === 'hint';
                        const isValidCode = isHint || row.code !== null;
                        if (!isValidCode || !row.name) {
                            conflictItems.push(`第 ${index + 1} 行：格式不完整或代碼無效`);
                            return;
                        }

                        // 1. Check defaultStrings conflict
                        if (isConflictWithDefault(row.type, row.code, row.name)) {
                            conflictItems.push(`(${getTypeLabel(row.type)} ${row.code} ${row.name}) 與 **預設 strings.conf** 衝突`);
                        }

                        // 2. Check other diyers conflict (diyers are already filtered for the current CDB)
                        diyers.value.forEach(other => {
                            if (currentDiyerId && other.id === currentDiyerId) return;
                            (other.strings || []).forEach(s => {
                                if (s.type === row.type) {
                                    if (isHint ? s.name === row.name : Number(s.code) === Number(row.code)) {
                                        conflictItems.push(`(${getTypeLabel(row.type)} ${row.code} ${row.name}) 與作者 **${escapeHtml(other.name)}** 衝突`);
                                    }
                                }
                            });
                        });
                    });

                    // 3. Check internal duplicates in form
                    const seen = new Set();
                    form.rows.forEach((row, index) => {
                        const key = `${row.type}-${row.type === 'hint' ? row.name : row.code}`;
                        if (seen.has(key)) {
                            conflictItems.push(`第 ${index + 1} 行與表單內其他行重複`);
                        }
                        seen.add(key);
                    });

                    return conflictItems;
                };

                // =========================================================================
                // 5. SweetAlert2 作者編輯器與區間建立器
                // =========================================================================

                /** 初始化卡號或字段區間的動態標籤新增與刪除產生器 */
                const initRangeBuilder = (inputId, addId, containerId, initialValues = [], isHex = false, onMessage = null) => {
                    const input = document.getElementById(inputId);
                    const addButton = document.getElementById(addId);
                    const container = document.getElementById(containerId);
                    let values = [...initialValues].map(Number);

                    /** 重新渲染區間標籤容器的顯示畫面 */
                    const render = () => {
                        container.replaceChildren();
                        const sorted = sortNumbers(values);
                        if (sorted.length === 0) {
                            container.textContent = '無';
                            return;
                        }
                        sorted.forEach((value, index) => {
                            const badge = document.createElement('span');
                            badge.className = 'diyer-keylabel';
                            const label = isHex ? formatHex2(value) : String(value);
                            badge.innerHTML = `<span>${label}</span><button type="button" class="module-icon-btn white" data-index="${index}">×</button>`;
                            container.appendChild(badge);
                        });
                    };

                    /** 新增輸入的區間值並更新渲染 */
                    const addValue = () => {
                        const raw = input.value.trim().replace(/^0x/i, '');
                        if (!raw) return;
                        const valid = isHex ? /^[0-9a-f]{1,2}$/i.test(raw) : /^\d+$/.test(raw);
                        const value = Number.parseInt(raw, isHex ? 16 : 10);
                        const maximum = isHex ? 255 : 2000;

                        if (!valid || value < 1 || value > maximum) {
                            if (onMessage) onMessage(isHex ? '字段區間須介於 01 至 FF' : '卡號區間須介於 1 至 2000', true);
                            return;
                        }
                        if (!values.includes(value)) values.push(value);

                        input.value = '';
                        render();
                        if (onMessage) onMessage('', false);
                    };

                    addButton.addEventListener('click', addValue);
                    input.addEventListener('keydown', e => {
                        if (e.key === 'Enter') {
                            e.preventDefault();
                            addValue();
                        }
                    });
                    container.addEventListener('click', e => {
                        const btn = e.target.closest('button[data-index]');
                        if (!btn) return;
                        values.splice(Number(btn.dataset.index), 1);
                        render();
                    });

                    render();
                    return { getValues: () => sortNumbers(values) };
                };

                /** 開啟新增或編輯作者的 SweetAlert2 互動彈窗 */
                const openDiyerModal = (diyer = null) => {
                    if (selectedCdbId.value == null) {
                        classicalSwal.fire({ icon: 'warning', title: '請先選擇 CDB' });
                        return;
                    }

                    const currentConfig = cdbConfigs.value.find(c => c.id === selectedCdbId.value);
                    const cdbName = currentConfig ? currentConfig.name : selectedCdbId.value;

                    const initialEntries = diyer ? getSortedDiyerStrings(diyer) : [];
                    const initialCodes = diyer?.codeRanges || [];
                    const initialSetRanges = diyer?.setRanges || [];
                    let editorState;
                    let showMessage = () => { };

                    classicalSwal.fire({
                        title: `${cdbName} - ${diyer ? '編輯作者' : '新增作者'}`,
                        width: 'min(1000px, 96vw)',
                        html: `
                        <div class="swal-row-container">
                            <div class="swal-col-container">
                                <div class="swal-row-container" style="width: 100%;">
                                    <fieldset class="module-fieldset">
                                        <legend>作者名稱</legend>
                                        <input id="swal-diyer-name" class="module-input-clean" value="${escapeHtml(diyer?.name)}">
                                    </fieldset>
                                    <fieldset class="module-fieldset swal-add-fieldset">
                                        <legend>字段區間</legend>
                                        <input id="swal-set-input" class="module-input-clean" placeholder="01~FF">
                                        <button id="swal-set-add" type="button" class="module-icon-btn">+</button>
                                    </fieldset>
                                    <fieldset class="module-fieldset swal-add-fieldset">
                                        <legend>卡號區間</legend>
                                        <input id="swal-code-input" class="module-input-clean" placeholder="1~2000">
                                        <button id="swal-code-add" type="button" class="module-icon-btn">+</button>
                                    </fieldset>
                                </div>
                                <div class="swal-row-container" style="width: 100%;">
                                    <textarea id="swal-string-import-text" class="module-textarea-clean" style="height: 100%;"
                                        placeholder="!setname 0x144 字段&#10;!counter 0x1 指示物&#10;!victory 0x1 特殊勝利&#10;!hint 提示&#10;#提示"></textarea>
                                </div>
                            </div>
                            <div class="swal-col-container">
                                <div class="swal-col-container" style="width: 100%;">
                                    <div id="swal-set-values" class="diyer-keylabel-container" style="width: 100%;"></div>
                                    <div id="swal-code-values" class="diyer-keylabel-container" style="width: 100%;"></div>
                                </div>
                                <div class="swal-col-container" style="width: 100%;">
                                    <button id="swal-string-add" type="button" class="module-btn">新增列</button>
                                    <button id="swal-string-import-btn" type="button" class="module-btn">解析匯入內容</button>
                                    <span id="swal-message-span" style="font-size: 1rem; font-weight: bold; color: var(--brown-hover); display: inline-flex; align-items: center; height: 100%;"></span>
                                </div>
                            </div>
                            <div class="module-table-container" style="max-height: 300px; overflow-y: auto; width: 100%;">
                                <table class="module-table">
                                    <thead>
                                        <tr>
                                            <th style="text-align: center;">檢查</th>
                                            <th>類型</th>
                                            <th>code</th>
                                            <th>名稱</th>
                                            <th style="text-align: center;">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody id="swal-editor-body" class="swal-editor-body"></tbody>
                                </table>
                            </div>
                        </div>`,
                        showCancelButton: true,
                        showDenyButton: !!diyer,
                        confirmButtonText: diyer ? '儲存' : '新增作者',
                        denyButtonText: '刪除作者',
                        cancelButtonText: '取消',
                        didOpen: () => {
                            const messageSpan = document.getElementById('swal-message-span');
                            showMessage = (msg, isError = false) => {
                                messageSpan.textContent = msg;
                                messageSpan.style.color = isError ? 'var(--red-color)' : 'var(--brown-hover)';
                            };

                            const codeBuilder = initRangeBuilder('swal-code-input', 'swal-code-add', 'swal-code-values', initialCodes, false, showMessage);
                            const setBuilder = initRangeBuilder('swal-set-input', 'swal-set-add', 'swal-set-values', initialSetRanges, true, showMessage);
                            const rowContainer = document.getElementById('swal-editor-body');

                            /** 更新彈窗中編輯列的驗證燈號與欄位狀態 */
                            const updateRowValidation = (rowTr) => {
                                const dot = rowTr.querySelector('.dot');
                                const typeVal = rowTr.querySelector('.string-type').value;
                                const codeVal = rowTr.querySelector('.string-code').value.trim();
                                const nameVal = rowTr.querySelector('.string-name').value.trim();

                                const isHint = (typeVal === 'hint');
                                const validatedCode = isHint ? null : checkCodeValue(codeVal, typeVal);
                                const isValidCode = isHint || validatedCode !== null;

                                // 檢查是否與 defaultStrings 衝突
                                let conflictWithDefault = isConflictWithDefault(typeVal, validatedCode, nameVal);

                                // 檢查同 CDB 內與其他作者（或自己排除當前 diyer）的衝突（diyers 本身已是當前 CDB）
                                let conflictWithOtherDiyer = false;
                                diyers.value.forEach(other => {
                                    if (diyer && other.id === diyer.id) return;
                                    const otherStrings = other.strings || [];
                                    otherStrings.forEach(s => {
                                        if (s.type === typeVal) {
                                            if (typeVal === 'hint') {
                                                if (s.name === nameVal) conflictWithOtherDiyer = true;
                                            } else {
                                                if (Number(s.code) === Number(validatedCode)) conflictWithOtherDiyer = true;
                                            }
                                        }
                                    });
                                });

                                // 同時檢查當前表格內是否有其他行重複衝突
                                let conflictInTable = false;
                                const allRows = rowContainer.querySelectorAll('.swal-editor-row');
                                allRows.forEach(r => {
                                    if (r === rowTr) return;
                                    const t = r.querySelector('.string-type').value;
                                    if (t !== typeVal) return;
                                    const n = r.querySelector('.string-name').value.trim();
                                    const c = r.querySelector('.string-code').value.trim();
                                    if (typeVal === 'hint') {
                                        if (n === nameVal) conflictInTable = true;
                                    } else {
                                        if (checkCodeValue(c, t) === validatedCode && validatedCode !== null) conflictInTable = true;
                                    }
                                });

                                const hasAnyConflict = conflictWithDefault || conflictWithOtherDiyer || conflictInTable;
                                const isValid = isValidCode && nameVal.length > 0 && !hasAnyConflict;

                                dot.classList.toggle('green', isValid);
                                dot.classList.toggle('red', !isValid);

                                const codeCell = rowTr.querySelector('.string-code-cell');
                                const nameCell = rowTr.querySelector('.string-name-cell');
                                const codeInput = rowTr.querySelector('.string-code');

                                if (isHint) {
                                    codeInput.value = '';
                                    if (codeCell) codeCell.style.display = 'none';
                                    if (nameCell) nameCell.setAttribute('colspan', '2');
                                } else {
                                    if (codeCell) codeCell.style.display = '';
                                    if (nameCell) nameCell.removeAttribute('colspan');
                                    codeInput.placeholder = '0x1441';
                                }
                            };

                            /** 在編輯表格中動態追加一列字串設定 */
                            const appendRow = entry => {
                                const currentType = entry.type || 'setname';
                                const isHint = currentType === 'hint';
                                const codeValRaw = entry.code != null && !isHint ? '0x' + Number(entry.code).toString(16).toUpperCase() : '';
                                const codeValue = escapeHtml(codeValRaw);

                                rowContainer.insertAdjacentHTML('beforeend', `
                                    <tr class="swal-editor-row">
                                        <td class="table-item-center"><div class="dot"></div></td>
                                        <td style="padding: 0; background: var(--white-hover); width: 1%;">
                                            <select class="module-select string-type" style="border: 0; background: transparent;">
                                                <option value="setname" ${currentType === 'setname' ? 'selected' : ''}>字段</option>
                                                <option value="counter" ${currentType === 'counter' ? 'selected' : ''}>指示物</option>
                                                <option value="victory" ${currentType === 'victory' ? 'selected' : ''}>特殊勝利</option>
                                                <option value="hint" ${currentType === 'hint' ? 'selected' : ''}>提示</option>
                                            </select>
                                        </td>
                                        <td class="string-code-cell" ${isHint ? 'style="display:none;"' : ''}><input class="module-input-clean string-code" value="${codeValue}" placeholder="0x1441" required></td>
                                        <td class="string-name-cell" ${isHint ? 'colspan="2"' : ''}><input class="module-input-clean string-name" value="${escapeHtml(entry.name || '')}" placeholder="名稱" required></td>
                                        <td class="table-item-center"><button type="button" class="module-btn string-delete">刪除</button></td>
                                    </tr>`);
                                updateRowValidation(rowContainer.lastElementChild);
                            };

                            initialEntries.forEach(appendRow);

                            document.getElementById('swal-string-add').addEventListener('click', () => appendRow({ type: 'setname' }));
                            rowContainer.addEventListener('click', e => {
                                if (e.target.closest('.string-delete')) {
                                    e.target.closest('tr').remove();
                                    rowContainer.querySelectorAll('.swal-editor-row').forEach(updateRowValidation);
                                }
                            });
                            rowContainer.addEventListener('input', () => {
                                rowContainer.querySelectorAll('.swal-editor-row').forEach(updateRowValidation);
                            });
                            rowContainer.addEventListener('change', () => {
                                rowContainer.querySelectorAll('.swal-editor-row').forEach(updateRowValidation);
                            });

                            document.getElementById('swal-string-import-btn').addEventListener('click', () => {
                                const importTextarea = document.getElementById('swal-string-import-text');
                                const text = importTextarea.value.trim();
                                if (!text) return showMessage('請輸入要解析的匯入內容', true);

                                const { entries, diyerMeta } = parseStringImport(text);
                                if (entries.length === 0 && !diyerMeta) return showMessage('沒有可匯入的有效內容', true);

                                const changes = [];

                                if (diyerMeta) {
                                    if (diyerMeta.name) {
                                        document.getElementById('swal-diyer-name').value = diyerMeta.name;
                                        changes.push(`作者名稱：${diyerMeta.name}`);
                                    }
                                    if (diyerMeta.codeRanges && diyerMeta.codeRanges.length > 0) {
                                        editorState.codeBuilder.setValues(diyerMeta.codeRanges);
                                        changes.push(`卡號區間：${diyerMeta.codeRanges.join(', ')}`);
                                    }
                                    if (diyerMeta.setRanges && diyerMeta.setRanges.length > 0) {
                                        editorState.setBuilder.setValues(diyerMeta.setRanges);
                                        changes.push(`字段區間：${diyerMeta.setRanges.map(formatHex2).join(', ')}`);
                                    }
                                }

                                let addedCount = 0;
                                let updatedCount = 0;

                                entries.forEach(entry => {
                                    let existingRow = Array.from(rowContainer.querySelectorAll('.swal-editor-row')).find(row => {
                                        const t = row.querySelector('.string-type').value;
                                        if (t !== entry.type) return false;
                                        if (t === 'hint') {
                                            return row.querySelector('.string-name').value.trim() === entry.name;
                                        } else {
                                            const codeInputVal = row.querySelector('.string-code').value.trim();
                                            const rowCode = checkCodeValue(codeInputVal, t);
                                            return rowCode === entry.code;
                                        }
                                    });

                                    if (existingRow) {
                                        existingRow.querySelector('.string-type').value = entry.type;
                                        const codeInput = existingRow.querySelector('.string-code');
                                        if (entry.type === 'hint') {
                                            codeInput.value = '';
                                        } else {
                                            codeInput.value = entry.code != null ? '0x' + Number(entry.code).toString(16).toUpperCase() : '';
                                        }
                                        existingRow.querySelector('.string-name').value = entry.name;
                                        updatedCount++;
                                    } else {
                                        appendRow(entry);
                                        addedCount++;
                                    }
                                });

                                rowContainer.querySelectorAll('.swal-editor-row').forEach(updateRowValidation);
                                importTextarea.value = '';

                                if (addedCount > 0) changes.push(`新增 ${addedCount} 筆字串`);
                                if (updatedCount > 0) changes.push(`更新 ${updatedCount} 筆字串`);

                                if (changes.length > 0) {
                                    showMessage(`已成功套用變動：${changes.join('、')}`, false);
                                } else {
                                    showMessage('沒有偵測到有效變動', true);
                                }
                            });

                            editorState = { codeBuilder, setBuilder };
                        },
                        preConfirm: () => {
                            const name = document.getElementById('swal-diyer-name').value.trim();
                            if (!name) {
                                showMessage('作者名稱不可為空', true);
                                return false;
                            }

                            const rows = [];
                            document.querySelectorAll('#swal-editor-body tr').forEach(row => {
                                const typeVal = row.querySelector('.string-type').value;
                                const rawCode = row.querySelector('.string-code').value.trim();
                                const rowName = row.querySelector('.string-name').value.trim();

                                let validatedCode = typeVal === 'hint' ? null : checkCodeValue(rawCode, typeVal);
                                if (typeVal === 'hint' || validatedCode !== null) {
                                    if (rowName.length > 0) {
                                        rows.push({ type: typeVal, code: validatedCode, name: rowName });
                                    }
                                }
                            });

                            showMessage('', false);
                            return {
                                name,
                                codeRanges: editorState.codeBuilder.getValues(),
                                setRanges: editorState.setBuilder.getValues(),
                                rows
                            };
                        }
                    }).then(async result => {
                        if (result.isDenied && diyer) {
                            const confirmDelete = await classicalSwal.fire({
                                icon: 'warning',
                                title: `確定要刪除作者「${diyer.name}」嗎？`,
                                text: '刪除後將無法復原！',
                                showCancelButton: true,
                                confirmButtonText: '確定刪除',
                                cancelButtonText: '取消',
                                confirmButtonColor: 'var(--red-color)'
                            });

                            if (confirmDelete.isConfirmed) {
                                try {
                                    await deleteDiyer(diyer.id);
                                    await fetchCurrentDiyer();
                                    classicalSwal.fire({
                                        icon: 'success',
                                        title: '刪除成功',
                                        timer: 1200,
                                        showConfirmButton: false
                                    });
                                } catch (error) {
                                    throwErrorSwal('刪除失敗', '無法刪除作者資料', error);
                                }
                            } else {
                                openDiyerModal(diyer);
                            }
                            return;
                        }

                        if (!result.isConfirmed) return;

                        // 檢查衝突並顯示詳細衝突面板
                        const conflicts = collectConflicts(result.value, diyer?.id ?? null);
                        if (conflicts.length > 0) {
                            let conflictHtml = '<div style="text-align: left; max-height: 250px; overflow-y: auto; font-size: 0.95rem; line-height: 1.6;">';
                            conflicts.forEach(c => {
                                conflictHtml += `<p style="margin-bottom: 4px;">&nbsp;&nbsp;• ${c}</p>`;
                            });
                            conflictHtml += '</div>';

                            const conflictRes = await classicalSwal.fire({
                                icon: 'error',
                                title: '發現衝突',
                                html: conflictHtml,
                                showCancelButton: true,
                                confirmButtonText: '返回編輯',
                                cancelButtonText: '取消編輯',
                                confirmButtonColor: 'var(--brown-color)',
                                cancelButtonColor: 'var(--red-color)'
                            });

                            if (conflictRes.isConfirmed) {
                                // 點擊返回編輯，重新開啟彈窗並帶入當前編輯資料
                                openDiyerModal(diyer ? { id: diyer.id, name: result.value.name, codeRanges: result.value.codeRanges, setRanges: result.value.setRanges, strings: result.value.rows } : { name: result.value.name, codeRanges: result.value.codeRanges, setRanges: result.value.setRanges, strings: result.value.rows });
                            }
                            return;
                        }

                        // 二次確認對話框
                        const confirmSave = await classicalSwal.fire({
                            icon: 'question',
                            title: '確認儲存',
                            text: '您確定要儲存此作者的變更嗎？',
                            showCancelButton: true,
                            confirmButtonText: '確定',
                            cancelButtonText: '返回編輯'
                        });

                        if (!confirmSave.isConfirmed) {
                            openDiyerModal(diyer ? { id: diyer.id, name: result.value.name, codeRanges: result.value.codeRanges, setRanges: result.value.setRanges, strings: result.value.rows } : { name: result.value.name, codeRanges: result.value.codeRanges, setRanges: result.value.setRanges, strings: result.value.rows });
                            return;
                        }

                        await saveDiyerWithValidation(result.value, diyer);
                    });
                };

                /** 執行帶驗證與二次確認的作者新增或更新儲存作業 */
                const saveDiyerWithValidation = async (form, diyer) => {
                    const diyerId = diyer?.id;
                    const payload = {
                        name: form.name,
                        ...(!diyerId ? { cdbId: selectedCdbId.value } : {}),
                        codeRanges: form.codeRanges,
                        setRanges: form.setRanges,
                        strings: form.rows.map(r => ({
                            code: r.code,
                            name: r.name,
                            type: r.type
                        }))
                    };

                    try {
                        diyerId ? await updateDiyer(diyerId, payload) : await createDiyer(payload);
                        await fetchCurrentDiyer();
                        classicalSwal.fire({
                            icon: 'success',
                            title: diyerId ? '更新成功' : '新增作者成功',
                            timer: 1200,
                            showConfirmButton: false
                        });
                    } catch (error) {
                        throwErrorSwal('儲存失敗', '無法儲存作者字串資料', error);
                        openDiyerModal(diyer ? { id: diyer.id, name: form.name, codeRanges: form.codeRanges, setRanges: form.setRanges, strings: form.rows } : { name: form.name, codeRanges: form.codeRanges, setRanges: form.setRanges, strings: form.rows });
                    }
                };

                // =========================================================================
                // 6. 配置檔案匯出 (.conf)
                // =========================================================================

                /** 將當前 CDB 的所有作者與字串配置匯出為 .conf 檔案 */
                const exportConfig = () => {
                    const sanitizeName = str => String(str || '').replace(/[\r\n]+/g, ' ');

                    const sections = [...diyers.value]
                        .sort((left, right) => {
                            const lRanges = sortNumbers(left.codeRanges).map(Number);
                            const rRanges = sortNumbers(right.codeRanges).map(Number);
                            const maxLen = Math.max(lRanges.length, rRanges.length);
                            for (let i = 0; i < maxLen; i++) {
                                const lVal = lRanges[i] ?? Number.POSITIVE_INFINITY;
                                const rVal = rRanges[i] ?? Number.POSITIVE_INFINITY;
                                if (lVal !== rVal) return lVal - rVal;
                            }
                            return left.name.localeCompare(right.name);
                        })
                        .map(diyer => {
                            const headerParts = [`!diyer ${diyer.name}`];
                            const codeRanges = sortNumbers(diyer.codeRanges);
                            if (codeRanges.length > 0) headerParts.push(codeRanges.join(','));

                            const setRanges = sortNumbers(diyer.setRanges).map(formatHex2);
                            if (setRanges.length > 0) headerParts.push(`0x${setRanges.join(',')}`);

                            const lines = [headerParts.join(' ')];
                            const entries = getCdbStrings(diyer);

                            entries.filter(e => e.type === 'setname').sort(sortSetnames).forEach(e => {
                                const hexCode = e.code != null ? Number(e.code).toString(16).toUpperCase() : '';
                                lines.push(`!setname 0x${hexCode} ${sanitizeName(e.name)}`);
                            });

                            const counters = entries.filter(e => e.type === 'counter').sort(sortCountersOrVictories);
                            if (counters.length > 0) {
                                lines.push('#counter');
                                counters.forEach(e => {
                                    const hexCode = e.code != null ? Number(e.code).toString(16).toUpperCase() : '';
                                    lines.push(`!counter 0x${hexCode} ${sanitizeName(e.name)}`);
                                });
                            }

                            const victories = entries.filter(e => e.type === 'victory').sort(sortCountersOrVictories);
                            if (victories.length > 0) {
                                lines.push('#victory');
                                victories.forEach(e => {
                                    const hexCode = e.code != null ? Number(e.code).toString(16).toUpperCase() : '';
                                    lines.push(`!victory 0x${hexCode} ${sanitizeName(e.name)}`);
                                });
                            }

                            const hints = entries.filter(e => e.type === 'hint');
                            if (hints.length > 0) {
                                hints.forEach(e => {
                                    lines.push(`!hint ${sanitizeName(e.name)}`);
                                });
                            }

                            return lines.join('\n');
                        });

                    const config = cdbConfigs.value.find(item => item.id === selectedCdbId.value);
                    const filename = `${(config?.name || 'cdb').replace(/[\\/:*?"<>|]+/g, '_')}.conf`;
                    const url = URL.createObjectURL(new Blob([sections.join('\n\n')], { type: 'text/plain;charset=utf-8' }));

                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    link.click();
                    setTimeout(() => URL.revokeObjectURL(url), 0);
                };

                // =========================================================================
                // 初始化
                // =========================================================================

                /** 非同步載入所有 CDB 配置清單 */
                const fetchCdbConfigs = async () => {
                    try {
                        cdbConfigs.value = await loadAllConfigs();
                        if (cdbConfigs.value.length > 0)
                            selectedCdbId.value = cdbConfigs.value[0]?.id;
                    } catch (error) {
                        throwErrorSwal('載入失敗', '無法取得 CDB 配置', error);
                    }
                };

                /** 根據當前選擇的 CDB ID 非同步載入對應的作者清單 */
                const fetchCurrentDiyer = async () => {
                    if (selectedCdbId.value === null) {
                        diyers.value = [];
                        return;
                    };
                    loaded.value = false;
                    try {
                        diyers.value = await loadDiyersByCdbId(selectedCdbId.value);
                    } catch (error) {
                        diyers.value = [];
                        throwErrorSwal('載入失敗', '無法取得作者配置', error);
                    } finally {
                        loaded.value = true;
                    }
                };

                /** 非同步讀取系統預設的 default strings.conf 配置 */
                const fetchDefaultStrings = async () => {
                    try {
                        defaultStrings.value = await loadDefaultStrings();
                    } catch (error) {
                        throwErrorSwal('載入失敗', '無法讀取 default strings.conf', error);
                    }
                };

                onMounted(async () => {
                    await fetchCdbConfigs();
                    await fetchCurrentDiyer();
                    await fetchDefaultStrings();
                });

                return {
                    // 狀態與資料
                    diyers,
                    cdbConfigs,
                    selectedCdbId,
                    sortedDiyers,
                    loaded,
                    expandDiyerIds,

                    // 表格交互與格式化
                    toggleDiyerRow,
                    formatHex2,
                    sortNumbers,
                    getSortedDiyerStrings,
                    getTypeLabel,

                    // 彈窗與匯出
                    openDiyerModal,
                    exportConfig,
                    getCurrentDiyer: fetchCurrentDiyer,

                    // 分頁控制
                    pageSizeOptions,
                    pageSize,
                    currentPage,
                    totalPages,
                    pagedItems,
                    previousPage,
                    nextPage,
                    onPageInput,
                    validatePage
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
