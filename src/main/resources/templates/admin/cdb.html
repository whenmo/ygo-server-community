<!DOCTYPE html>
<html lang="zh-Hans" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員設定</title>

    <!-- 全局古典風格樣式表 -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/two_colume_layout.css}" href="/css/two_colume_layout.css">
    <link rel="stylesheet" th:href="@{/css/sweetalert.css}" href="/css/sweetalert.css">
    <link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css">

    <!-- CDN 套件 -->
    <script th:src="@{/js/vue.global.prod.js}" src="/js/vue.global.prod.js"></script>
    <script th:src="@{/js/axios.min.js}" src="/js/axios.min.js"></script>
    <script th:src="@{/js/sweetalert2.all.min.js}" src="/js/sweetalert2.all.min.js"></script>

    <style>
        .table-col-first {
            width: 120px;
        }

        .table-item-name {
            color: var(--red-color);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div id="app" class="two-column-layout-container">
        <div th:replace="~{admin/menu :: sidebar('cdb')}"></div>

        <!-- 右側主要內容區 -->
        <main class="main-column">
            <div class="main-top-bar">
                <div class="main-top-bar-row">
                    <h2 class="main-top-bar-title">數據庫清單</h2>
                    <div style="display: flex; gap: 10px;">
                        <button @click="openCreateModal" class="main-top-bar-btn">新增配置</button>
                        <button @click="openBatchDeleteModal" class="main-top-bar-btn">批量刪除</button>
                    </div>
                </div>
            </div>

            <!-- 資料表格 -->
            <div class="module-table-container">
                <table class="module-table">
                    <thead>
                        <tr>
                            <th class="table-col-first">名稱</th>
                            <th>cdb 路徑</th>
                            <th>圖片 cdn</th>
                            <th class="table-col-oper">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-if="loading">
                            <td colspan="4" class="table-item-empty-row">載入中...</td>
                        </tr>
                        <tr v-else-if="configs.length === 0">
                            <td colspan="4" class="table-item-empty-row">目前尚無數據庫資料</td>
                        </tr>
                        <tr v-else v-for="item in configs" :key="item.id">
                            <td class="table-col-first" style="border-top: 1px solid var(--brown-hover);">
                                <strong class="table-item-name">{{ item.name }}</strong>
                            </td>
                            <td style="border-top: 1px solid var(--brown-hover);"><code>{{ item.filePath }}</code></td>
                            <td style="border-top: 1px solid var(--brown-hover);"><code>{{ item.picCdn }}</code></td>
                            <td class="table-col-oper" style="border-top: 1px solid var(--brown-hover);">
                                <div class="table-col-oper-container">
                                    <button class="module-btn" @click="refreshCache(item)">刷新快取</button>
                                    <button class="module-btn" @click="openEditModal(item)">編輯</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const classicalSwal = Swal.mixin({
            customClass: {
                popup: 'swal-popup',
                title: 'swal-title'
            },
            buttonsStyling: true
        });

        createApp({
            setup() {
                const configs = ref([]);
                const loading = ref(false);

                const fetchConfigs = async () => {
                    loading.value = true;
                    try {
                        const response = await axios.get('/api/cdb_config');
                        configs.value = response.data;
                    } catch (error) {
                        classicalSwal.fire({
                            icon: 'error',
                            title: '載入失敗',
                            text: error.response?.data?.message || '無法取得數據庫配置'
                        });
                    } finally {
                        loading.value = false;
                    }
                };

                const refreshCache = async (item) => {
                    try {
                        await axios.get(`/api/cdb/card/${item.id}?refresh=true`);
                        classicalSwal.fire({ icon: 'success', title: '快取已刷新', timer: 1200, showConfirmButton: false });
                    } catch (error) {
                        classicalSwal.fire({ icon: 'error', title: '刷新失敗', text: error.response?.data || '無法讀取 CDB 檔案' });
                    }
                };

                const removeConfigAndCache = async (id) => {
                    await axios.delete(`/api/cdb_config/${id}`);
                };

                const initSwalToggle = (checkboxId, initState) => {
                    const checkbox = document.getElementById(checkboxId);
                    if (!checkbox) return;

                    const btn = checkbox.parentElement;
                    if (!btn) return;

                    if (typeof initState === 'boolean') checkbox.checked = initState;

                    btn.classList.toggle('active', checkbox.checked);

                    if (btn.dataset.hasToggleListener) return;
                    btn.dataset.hasToggleListener = 'true';

                    btn.addEventListener('click', (e) => {
                        if (e.target !== checkbox) checkbox.checked = !checkbox.checked;
                        btn.classList.toggle('active', checkbox.checked);
                    });
                };

                const openCreateModal = () => {
                    classicalSwal.fire({
                        title: '新增配置',
                        html: `
                            <div class="swal-row-container">
                                <fieldset class="module-fieldset">
                                    <legend>名稱</legend>
                                    <input id="swal-name" class="module-input-clean" placeholder="card">
                                </fieldset>
                                <fieldset class="module-fieldset">
                                    <legend>cdb 路徑</legend>
                                    <input id="swal-filePath" class="module-input-clean" placeholder="本地絕對路徑/xxx.cdb">
                                </fieldset>
                                <fieldset class="module-fieldset">
                                    <legend>圖片網址</legend>
                                    <input id="swal-picCdn" class="module-input-clean">
                                </fieldset>
                            </div>
                        `,
                        showCancelButton: true,
                        confirmButtonText: '新增',
                        cancelButtonText: '取消',
                        preConfirm: () => {
                            const name = document.getElementById('swal-name').value.trim();
                            const filePath = document.getElementById('swal-filePath').value.trim();
                            const picCdn = document.getElementById('swal-picCdn').value.trim() || null;

                            if (!name || !filePath) {
                                Swal.showValidationMessage('名稱或路徑不可為空');
                                return false;
                            }
                            return { name, filePath, picCdn };
                        }
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                await axios.post('/api/cdb_config', result.value);
                                classicalSwal.fire({ icon: 'success', title: '新增成功', timer: 1200, showConfirmButton: false });
                                fetchConfigs();
                            } catch (error) {
                                classicalSwal.fire({ icon: 'error', title: '新增失敗', text: error.response?.data?.message || '操作失敗' });
                            }
                        }
                    });
                };

                const openEditModal = (item) => {
                    classicalSwal.fire({
                        title: '編輯配置',
                        html: `
                            <div class="swal-row-container">
                                <fieldset class="module-fieldset">
                                    <legend>名稱</legend>
                                    <input id="swal-name" class="module-input-clean" value="${item.name}" placeholder="card">
                                </fieldset>
                                <fieldset class="module-fieldset">
                                    <legend>路徑</legend>
                                    <input id="swal-filePath" class="module-input-clean" value="${item.filePath}" placeholder="本地絕對路徑/xxx.cdb">
                                </fieldset>
                                <fieldset class="module-fieldset">
                                    <legend>圖片 cdn</legend>
                                    <input id="swal-picCdn" class="module-input-clean" value="${item.picCdn}">
                                </fieldset>
                            </div>
                        `,
                        showDenyButton: true,
                        showCancelButton: true,
                        confirmButtonText: '儲存',
                        cancelButtonText: '取消',
                        denyButtonText: '刪除',
                        customClass: {
                            popup: 'swal-popup',
                            title: 'swal-title'
                        },
                        preConfirm: () => {
                            const name = document.getElementById('swal-name').value.trim();
                            const filePath = document.getElementById('swal-filePath').value.trim();
                            const picCdn = document.getElementById('swal-picCdn').value.trim() || null;

                            if (!name || !filePath) {
                                Swal.showValidationMessage('名稱或路徑不可為空');
                                return false;
                            }
                            return { name, filePath, picCdn };
                        }
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                const oldFilePath = item.filePath;
                                await axios.put(`/api/cdb_config/${item.id}`, result.value);
                                classicalSwal.fire({ icon: 'success', title: '更新成功', timer: 1200, showConfirmButton: false });
                                fetchConfigs();
                            } catch (error) {
                                classicalSwal.fire({ icon: 'error', title: '更新失敗', text: error.response?.data?.message || '操作失敗' });
                            }
                        } else if (result.isDenied) {
                            classicalSwal.fire({
                                title: '確認刪除？',
                                text: `確定要刪除數據庫「${item.name}」嗎？此操作將無法復原！`,
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonText: '確定刪除',
                                cancelButtonText: '取消'
                            }).then(async (delResult) => {
                                if (delResult.isConfirmed) {
                                    try {
                                        await removeConfigAndCache(item.id);
                                        classicalSwal.fire({ icon: 'success', title: '已刪除', timer: 1200, showConfirmButton: false });
                                        fetchConfigs();
                                    } catch (error) {
                                        classicalSwal.fire({ icon: 'error', title: '刪除失敗', text: error.response?.data?.message || '操作失敗' });
                                    }
                                }
                            });
                        }
                    });
                };

                const openBatchDeleteModal = () => {
                    if (configs.value.length === 0) {
                        classicalSwal.fire({ icon: 'info', title: '目前沒有資料可刪除' });
                        return;
                    }

                    const checkboxesHtml = configs.value.map(item => `
                        <button type="button" class="module-toggle" style="align-self: auto;">
                            <span class="module-toggle-status"></span>
                            <span>${item.name}</span>
                            <input type="checkbox" id="batch-cb-${item.id}" class="batch-delete-checkbox" value="${item.id}">
                        </button>
                    `).join('');

                    classicalSwal.fire({
                        title: '批量刪除',
                        html: `
                            <div style="max-height: 250px; overflow-y: auto; padding: 5px; display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch;">
                                ${checkboxesHtml}
                            </div>
                        `,
                        showCancelButton: true,
                        confirmButtonText: '刪除',
                        cancelButtonText: '取消',
                        didOpen: () => {
                            configs.value.forEach(item => {
                                initSwalToggle(`batch-cb-${item.id}`, false);
                            });
                        },
                        preConfirm: () => {
                            const selectedIds = Array.from(document.querySelectorAll('.batch-delete-checkbox:checked')).map(cb => cb.value);

                            if (selectedIds.length === 0) {
                                Swal.showValidationMessage('請至少勾選一個要刪除的項目');
                                return false;
                            }
                            return selectedIds;
                        }
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            const selectedIds = result.value;
                            classicalSwal.fire({
                                title: `確定要刪除選取的 ${selectedIds.length} 個數據庫嗎？`,
                                text: '此操作無法復原！',
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonText: '刪除',
                                cancelButtonText: '取消'
                            }).then(async (confirmResult) => {
                                if (confirmResult.isConfirmed) {
                                    try {
                                        for (const id of selectedIds) {
                                            const item = configs.value.find(c => c.id == id);
                                            if (item) {
                                                await removeConfigAndCache(item.id);
                                            }
                                        }
                                        classicalSwal.fire({ icon: 'success', title: '批次刪除成功', timer: 1200, showConfirmButton: false });
                                        fetchConfigs();
                                    } catch (error) {
                                        classicalSwal.fire({ icon: 'error', title: '部分刪除失敗', text: '操作過程中發生錯誤' });
                                        fetchConfigs();
                                    }
                                }
                            });
                        }
                    });
                };

                onMounted(() => {
                    fetchConfigs();
                });

                return { configs, loading, openCreateModal, openEditModal, openBatchDeleteModal, refreshCache };
            }
        }).mount('#app');
    </script>

</body>

</html>
