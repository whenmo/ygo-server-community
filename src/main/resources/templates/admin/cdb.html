<!DOCTYPE html>
<html lang="zh-Hans" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據庫管理</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/sweetalert.css}" href="/css/sweetalert.css">
    <link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css">
    <link rel="stylesheet" th:href="@{/css/pageHelper.css}" href="/css/pageHelper.css">

    <script th:src="@{/js/common/axios.min.js}" src="/js/common/axios.min.js"></script>
    <script th:src="@{/js/common/vue.global.prod.js}" src="/js/common/vue.global.prod.js"></script>
    <script th:src="@{/js/common/sweetalert2.all.min.js}" src="/js/common/sweetalert2.all.min.js"></script>
    <script th:src="@{/js/common/pageHelper.js}" src="/js/common/pageHelper.js"></script>
    <script th:src="@{/js/common/navbar.js}" src="/js/common/navbar.js"></script>

    <script th:src="@{/js/api/cdbConfigHelper.js}" src="/js/api/cdbConfigHelper.js"></script>
    <script th:src="@{/js/api/cdbHelper.js}" src="/js/api/cdbHelper.js"></script>

    <style>
        .top-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--red-color);
        }

        .top-title>h2 {
            font-size: 1.5rem;
            color: var(--red-color);
            margin: 0;
            font-variant: small-caps;
        }

        .table-item-name,
        .table-item-file-path {
            width: 1%;
        }

        .table-item-name,
        .table-item-file-path,
        .table-item-pic-cdn {
            border-top: 1px solid var(--brown-hover);
        }

        .table-item-name {
            color: var(--red-color);
            font-weight: bold;
        }

        .swal-backup-cdn-fieldset {
            align-self: stretch;
        }

        .swal-backup-cdn-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto auto;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .swal-backup-cdn-row input {
            box-sizing: border-box;
            min-width: 0;
            padding: 8px 10px 8px 0;
            margin-left: 10px;
            border-bottom: 1px solid var(--brown-color);
        }

        .swal-backup-cdn-row input:focus {
            border-bottom: 1px solid var(--red-color);
        }

        @media (max-width: 520px) {
            .swal-backup-cdn-row {
                grid-template-columns: minmax(0, 1fr) auto;
            }

            .swal-backup-cdn-row input {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: navbar('admin')}"></div>

    <main id="app" class="main-one-col-layout">
        <div class="top-title">
            <h2>數據庫清單({{ configs.length ?? 0 }})</h2>
            <div style="display: flex; gap: 8px; align-items: center;">
                <select v-model.number="pageSize" class="module-select" style="width: auto;">
                    <option v-for="size in pageSizeOptions" :key="size" :value="size">{{ size }} 筆/頁</option>
                </select>
                <button @click="openModal()" class="module-btn">新增配置</button>
            </div>
        </div>

        <!-- 資料表格 -->
        <div class="module-table-container">
            <table class="module-table">
                <thead>
                    <tr>
                        <th>名稱</th>
                        <th>cdb 路徑</th>
                        <th>主要圖片 CDN</th>
                        <th class="table-head-center">操作</th>
                    </tr>
                </thead>
                <tbody v-if="loading">
                    <tr>
                        <td colspan="4" class="table-item-empty-row">載入中...</td>
                    </tr>
                </tbody>
                <tbody v-else-if="configs.length === 0">
                    <tr>
                        <td colspan="4" class="table-item-empty-row">目前尚無數據庫資料</td>
                    </tr>
                </tbody>
                <tbody v-else>
                    <template v-for="item in pagedCards" :key="item.id">
                        <tr>
                            <td class="table-item-name">{{ item.name }}</td>
                            <td class="table-item-file-path"><code>{{ item.filePath }}</code></td>
                            <td class="table-item-pic-cdn"><code>{{ item.picCdn }}</code></td>
                            <td class="table-item-center">
                                <div class="table-col-oper-container">
                                    <button class="module-btn" @click="refreshCache(item)">刷新快取</button>
                                    <button class="module-btn" @click="openModal(item)">編輯</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <!-- 底部分頁選擇器 -->
        <div v-if="totalPages > 1" class="result-page-row" style="flex-shrink: 0; margin-top: auto;">
            <button type="button" @click="previousPage" :disabled="currentPage === 1">上一頁</button>
            <span>
                <input class="module-input-clean" :value="currentPage" @input="onPageInput" @blur="validatePage" />
                / {{ totalPages }}
            </span>
            <button type="button" @click="nextPage" :disabled="currentPage === totalPages">下一頁</button>
        </div>
    </main>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const classicalSwal = Swal.mixin({
            customClass: {
                popup: 'swal-popup',
                title: 'swal-title'
            },
            buttonsStyling: true
        });

        createApp({
            setup() {
                const configs = ref([]);
                const loading = ref(false);

                const {
                    loadAllConfigs,
                    createConfig,
                    updateConfig,
                    deleteConfig
                } = useCdbConfigHelper();

                const {
                    refreshCard,
                    refreshStrings,
                    refreshLflist
                } = useCdbHelper();

                const {
                    pageSizeOptions,
                    pageSize,
                    currentPage,
                    totalPages,
                    pagedCards,
                    previousPage,
                    nextPage,
                    onPageInput,
                    validatePage
                } = window.usePageHelper(configs, 10);

                const fetchConfigs = async (force = false) => {
                    loading.value = true;
                    try {
                        configs.value = await loadAllConfigs(force);
                    } catch (error) {
                        classicalSwal.fire({
                            icon: 'error',
                            title: '載入失敗',
                            text: error.response?.data?.message || '無法取得數據庫配置'
                        });
                    } finally {
                        loading.value = false;
                    }
                };

                const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (character) => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                })[character]);

                const refreshCache = async (item) => {
                    try {
                        await Promise.all([
                            refreshCard(item.id),
                            refreshStrings(item.id),
                            refreshLflist(item.id)
                        ]);
                        classicalSwal.fire({ icon: 'success', title: '快取已刷新', timer: 1200, showConfirmButton: false });
                    } catch (error) {
                        classicalSwal.fire({ icon: 'error', title: '刷新失敗', text: error.response?.data || '無法讀取 CDB 檔案' });
                    }
                };

                const openModal = (item = null) => {
                    const isEdit = !!item;
                    const title = isEdit ? '編輯配置' : '新增配置';
                    const backupPicCdns = Array.isArray(item?.backupPicCdns) ? item.backupPicCdns : [];

                    classicalSwal.fire({
                        title: title,
                        html: `
                            <div class="swal-row-container">
                                <fieldset class="module-fieldset">
                                    <legend>名稱 *</legend>
                                    <input id="swal-name" class="module-input-clean" value="${isEdit ? escapeHtml(item.name) : ''}">
                                </fieldset>
                                <fieldset class="module-fieldset">
                                    <legend>cdb 路徑 *</legend>
                                    <input id="swal-filePath" class="module-input-clean" value="${isEdit ? escapeHtml(item.filePath) : ''}">
                                </fieldset>
                                <fieldset class="module-fieldset">
                                    <legend>主要圖片 cdn *</legend>
                                    <input id="swal-picCdn" class="module-input-clean" value="${isEdit ? escapeHtml(item.picCdn) : ''}" placeholder='完整路徑, id 以 "__id__" 代替'>
                                </fieldset>
                                <fieldset class="module-fieldset swal-backup-cdn-fieldset">
                                    <legend>備用圖片 cdn</legend>
                                    <div id="swal-backup-cdn-list"></div>
                                </fieldset>
                            </div>
                        `,
                        showCancelButton: true,
                        showDenyButton: isEdit,
                        confirmButtonText: isEdit ? '儲存' : '新增',
                        cancelButtonText: '取消',
                        denyButtonText: '刪除',
                        customClass: {
                            popup: 'swal-popup',
                            title: 'swal-title'
                        },
                        didOpen: () => {
                            const backupList = document.getElementById('swal-backup-cdn-list');
                            backupList.innerHTML = '';

                            const createInput = (value = '') => {
                                const input = document.createElement('input');
                                input.type = 'text';
                                input.className = 'module-input-clean';
                                input.placeholder = '完整路徑, id 以 "__id__" 代替';
                                input.value = value ?? '';
                                return input;
                            };

                            const keepDraftAtBottom = () => {
                                const draftRow = backupList.querySelector('[data-role="draft"]');
                                if (draftRow) {
                                    backupList.append(draftRow);
                                }
                            };

                            // 已新增的項目列：包含 input 與「刪除」按鈕，排在下方並納入送出
                            const appendCommittedRow = (value = '') => {
                                const row = document.createElement('div');
                                row.className = 'swal-backup-cdn-row';
                                row.dataset.role = 'item';

                                const input = createInput(value);

                                const deleteButton = document.createElement('button');
                                deleteButton.type = 'button';
                                deleteButton.className = 'module-btn';
                                deleteButton.textContent = '刪除';

                                deleteButton.addEventListener('click', () => {
                                    row.remove();
                                    ensureDraftRow();
                                });

                                row.append(input, deleteButton);
                                backupList.append(row);
                                keepDraftAtBottom();
                                return input;
                            };

                            const ensureDraftRow = () => {
                                let draftRow = backupList.querySelector('[data-role="draft"]');
                                if (draftRow) {
                                    backupList.append(draftRow);
                                    return;
                                }

                                draftRow = document.createElement('div');
                                draftRow.className = 'swal-backup-cdn-row';
                                draftRow.dataset.role = 'draft';

                                const draftInput = createInput('');

                                const addButton = document.createElement('button');
                                addButton.type = 'button';
                                addButton.className = 'module-btn';
                                addButton.style.padding = '8px 10px';
                                addButton.textContent = '新增';

                                addButton.addEventListener('click', () => {
                                    const val = draftInput.value.trim();
                                    if (!val) {
                                        draftInput.focus();
                                        return;
                                    }
                                    appendCommittedRow(val);
                                    draftInput.value = '';
                                    draftInput.focus();
                                });

                                draftRow.append(draftInput, addButton);
                                backupList.append(draftRow);
                            };

                            backupPicCdns
                                .map(v => (typeof v === 'string' ? v.trim() : ''))
                                .filter(Boolean)
                                .forEach(appendCommittedRow);

                            ensureDraftRow();
                        },
                        preConfirm: () => {
                            const name = document.getElementById('swal-name').value.trim();
                            const filePath = document.getElementById('swal-filePath').value.trim();
                            const picCdn = document.getElementById('swal-picCdn').value.trim() || null;

                            const backupPicCdns = Array.from(
                                document.querySelectorAll('#swal-backup-cdn-list [data-role="item"] input')
                            )
                                .map(input => input.value.trim())
                                .filter(Boolean);

                            if (!name || !filePath) {
                                Swal.showValidationMessage('名稱或路徑不可為空');
                                return false;
                            }
                            return { name, filePath, picCdn, backupPicCdns };
                        }
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                if (isEdit) {
                                    await updateConfig(item.id, result.value);
                                    classicalSwal.fire({ icon: 'success', title: '更新成功', timer: 1200, showConfirmButton: false });
                                } else {
                                    await createConfig(result.value);
                                    classicalSwal.fire({ icon: 'success', title: '新增成功', timer: 1200, showConfirmButton: false });
                                }
                                fetchConfigs(true);
                            } catch (error) {
                                classicalSwal.fire({ icon: 'error', title: isEdit ? '更新失敗' : '新增失敗', text: error.response?.data?.message || '操作失敗' });
                            }
                        } else if (result.isDenied) {
                            classicalSwal.fire({
                                title: '確認刪除？',
                                text: `確定要刪除數據庫「${item.name}」嗎？此操作將無法復原！`,
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonText: '確定刪除',
                                cancelButtonText: '取消'
                            }).then(async (delResult) => {
                                if (delResult.isConfirmed) {
                                    try {
                                        await deleteConfig(item.id);
                                        classicalSwal.fire({ icon: 'success', title: '已刪除', timer: 1200, showConfirmButton: false });
                                        fetchConfigs(true);
                                    } catch (error) {
                                        classicalSwal.fire({ icon: 'error', title: '刪除失敗', text: error.response?.data?.message || '操作失敗' });
                                    }
                                }
                            });
                        }
                    });
                };

                onMounted(() => {
                    fetchConfigs();
                });

                return {
                    configs,
                    loading,
                    openModal,
                    refreshCache,
                    pageSizeOptions,
                    pageSize,
                    currentPage,
                    totalPages,
                    pagedCards,
                    previousPage,
                    nextPage,
                    onPageInput,
                    validatePage
                };
            }
        }).mount('#app');
    </script>

</body>

</html>
