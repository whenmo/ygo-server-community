<!DOCTYPE html>
<html lang="zh-Hans" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理員設定</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/sweetalert.css}" href="/css/sweetalert.css">
    <link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css">
    <link rel="stylesheet" th:href="@{/css/pageHelper.css}" href="/css/pageHelper.css">

    <script th:src="@{/js/common/axios.min.js}" src="/js/common/axios.min.js"></script>
    <script th:src="@{/js/common/vue.global.prod.js}" src="/js/common/vue.global.prod.js"></script>
    <script th:src="@{/js/common/sweetalert2.all.min.js}" src="/js/common/sweetalert2.all.min.js"></script>
    <script th:src="@{/js/common/pageHelper.js}" src="/js/common/pageHelper.js"></script>
    <script th:src="@{/js/common/navbar.js}" src="/js/common/navbar.js"></script>

    <script th:src="@{/js/api/userHelper.js}" src="/js/api/userHelper.js"></script>

    <style>
        .top-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--red-color);
        }

        .top-title>h2 {
            font-size: 1.5rem;
            color: var(--red-color);
            margin: 0;
            font-variant: small-caps;
        }

        .table-item-name {
            color: var(--red-color);
            font-weight: bold;
            border-top: 1px solid var(--brown-hover);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: navbar('admin')}"></div>

    <main id="app" class="main-one-col-layout">
        <div class="top-title">
            <h2>用戶清單({{ users.length ?? 0 }})</h2>
            <select v-model.number="pageSize" class="module-select" style="width: auto;">
                <option v-for="size in pageSizeOptions" :key="size" :value="size">{{ size }} 筆/頁</option>
            </select>
        </div>

        <!-- 資料表格 -->
        <div class="module-table-container">
            <table class="module-table">
                <thead>
                    <tr>
                        <th class="table-head-center">管理</th>
                        <th>名稱</th>
                        <th class="table-head-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-if="loading">
                        <td colspan="3" class="table-item-empty-row">載入中...</td>
                    </tr>
                    <tr v-else-if="users.length === 0">
                        <td colspan="3" class="table-item-empty-row">目前尚無用戶資料</td>
                    </tr>
                    <tr v-else v-for="item in pagedCards" :key="item.id">
                        <td class="table-item-center">
                            <div class="dot" :class="{ green: item.isAdmin }"></div>
                        </td>
                        <td class="table-item-name">{{ item.name }}</td>
                        <td class="table-item-center">
                            <button class="module-btn" @click="openEditModal(item)">編輯</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- 底部分頁選擇器 -->
        <div v-if="totalPages > 1" class="result-page-row" style="flex-shrink: 0; margin-top: auto;">
            <button type="button" @click="previousPage" :disabled="currentPage === 1">上一頁</button>
            <span>
                <input class="module-input-clean" :value="currentPage" @input="onPageInput" @blur="validatePage" />
                / {{ totalPages }}
            </span>
            <button type="button" @click="nextPage" :disabled="currentPage === totalPages">下一頁</button>
        </div>
    </main>

    <script>
        const { createApp, ref, onMounted } = Vue;

        const classicalSwal = Swal.mixin({
            customClass: {
                popup: 'swal-popup',
                title: 'swal-title'
            },
            buttonsStyling: true
        });

        createApp({
            setup() {
                const users = ref([]);
                const loading = ref(false);
                const { loadUsers, deleteUser, updateAdminUserInfo } = window.useUserHelper();

                const {
                    pageSizeOptions,
                    pageSize,
                    currentPage,
                    totalPages,
                    pagedCards,
                    previousPage,
                    nextPage,
                    onPageInput,
                    validatePage
                } = window.usePageHelper(users, 10);

                // 查詢所有用戶
                const fetchUsers = async () => {
                    loading.value = true;
                    try {
                        users.value = await loadUsers();
                    } catch (error) {
                        classicalSwal.fire({
                            icon: 'error',
                            title: '載入失敗',
                            text: error.response?.data?.message || '無法取得用戶配置'
                        });
                    } finally {
                        loading.value = false;
                    }
                };

                // 編輯用戶名稱
                const openEditModal = (item) => {
                    classicalSwal.fire({
                        title: '編輯用戶',
                        html: `
                            <div class="swal-row-container">
                                <fieldset class="module-fieldset">
                                    <legend>帳號</legend>
                                    <input id="swal-username" class="module-input-clean" value="${item.name}">
                                </fieldset>
                            </div>
                        `,
                        showDenyButton: true,
                        showCancelButton: true,
                        confirmButtonText: '儲存',
                        cancelButtonText: '取消',
                        denyButtonText: '刪除',
                        preConfirm: () => {
                            const name = document.getElementById('swal-username').value.trim();

                            if (!name) {
                                Swal.showValidationMessage('帳號不可為空');
                                return false;
                            }

                            return { name };
                        }
                    }).then(async (result) => {
                        if (result.isConfirmed) {
                            try {
                                await updateAdminUserInfo(item.id, result.value);
                                classicalSwal.fire({ icon: 'success', title: '更新成功', timer: 1200, showConfirmButton: false });
                                fetchUsers();
                            } catch (error) {
                                classicalSwal.fire({ icon: 'error', title: '更新失敗', text: error.response?.data?.message || '操作失敗' });
                            }
                        } else if (result.isDenied) {
                            classicalSwal.fire({
                                title: '確認刪除？',
                                text: `確定要刪除用戶「${item.name}」嗎？此操作將無法復原！`,
                                icon: 'warning',
                                showCancelButton: true,
                                confirmButtonText: '確定刪除',
                                cancelButtonText: '取消'
                            }).then(async (delResult) => {
                                if (delResult.isConfirmed) {
                                    try {
                                        await deleteUser(item.id);
                                        classicalSwal.fire({ icon: 'success', title: '已刪除', timer: 1200, showConfirmButton: false });
                                        fetchUsers();
                                    } catch (error) {
                                        classicalSwal.fire({ icon: 'error', title: '刪除失敗', text: error.response?.data?.message || '操作失敗' });
                                    }
                                }
                            });
                        }
                    });
                };

                onMounted(() => {
                    fetchUsers();
                });

                return {
                    users,
                    loading,
                    openEditModal,
                    pageSizeOptions,
                    pageSize,
                    currentPage,
                    totalPages,
                    pagedCards,
                    previousPage,
                    nextPage,
                    onPageInput,
                    validatePage
                };
            }
        }).mount('#app');
    </script>

</body>

</html>
