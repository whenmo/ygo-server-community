<!DOCTYPE html>
<html lang="zh-Hans" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告管理</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
    <link rel="stylesheet" th:href="@{/css/module.css}" href="/css/module.css">
    <link rel="stylesheet" th:href="@{/css/pageHelper.css}" href="/css/pageHelper.css">
    <link rel="stylesheet" th:href="@{/css/sweetalert.css}" href="/css/sweetalert.css">

    <script th:src="@{/js/common/axios.min.js}" src="/js/common/axios.min.js"></script>
    <script th:src="@{/js/common/sweetalert2.all.min.js}" src="/js/common/sweetalert2.all.min.js"></script>
    <script th:src="@{/js/common/vue.global.prod.js}" src="/js/common/vue.global.prod.js"></script>
    <script th:src="@{/js/common/pageHelper.js}" src="/js/common/pageHelper.js"></script>
    <script th:src="@{/js/common/navbar.js}" src="/js/common/navbar.js"></script>

    <script th:src="@{/js/api/boardHelper.js}" src="/js/api/boardHelper.js"></script>

    <style>
        .top-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid var(--red-color);
        }

        .top-title>h2 {
            font-size: 1.5rem;
            color: var(--red-color);
            margin: 0;
            font-variant: small-caps;
        }

        .table-item-name {
            color: var(--red-color);
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/layout :: navbar('admin')}"></div>

    <main id="app" class="main-one-col-layout">
        <div class="top-title">
            <h2>公告清單({{ boards.length ?? 0 }})</h2>
            <div style="display: flex; gap: 8px; align-items: center;">
                <select v-model.number="pageSize" class="module-select" style="width: auto;">
                    <option v-for="size in pageSizeOptions" :key="size" :value="size">{{ size }} 筆/頁</option>
                </select>
                <button @click="createBoard" class="module-btn">新增公告</button>
            </div>
        </div>

        <!-- 資料表格 -->
        <div class="module-table-container">
            <table class="module-table">
                <thead>
                    <tr>
                        <th class="table-head-center">置頂</th>
                        <th class="table-head-center">日期</th>
                        <th>標題</th>
                        <th class="table-head-center">上次編輯</th>
                        <th class="table-head-center">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-if="!loaded">
                        <td colspan="5" class="table-item-empty-row">載入中...</td>
                    </tr>
                    <tr v-else-if="boards.length === 0">
                        <td colspan="5" class="table-item-empty-row">目前尚無公告</td>
                    </tr>
                    <tr v-else v-for="board in pagedCards" :key="board.id">
                        <td class="table-item-center">
                            <div class="dot" :class="{ green: board.isTop }"></div>
                        </td>
                        <td class="table-item-center">{{ formatTime(board.updatedAt) }}</td>
                        <td style="border-top: 1px solid var(--brown-hover);">
                            <p class="table-item-name">{{ board.title }}</p>
                        </td>
                        <td class="table-item-center">
                            <p class="table-item-name">{{ board.user?.name ?? '—' }}</p>
                        </td>
                        <td class="table-item-center">
                            <button class="module-btn" @click="editBoard(board)">編輯</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 底部分頁選擇器 -->
        <div v-if="totalPages > 1" class="result-page-row" style="flex-shrink: 0; margin-top: auto;">
            <button type="button" @click="previousPage" :disabled="currentPage === 1">上一頁</button>
            <span>
                <input class="module-input-clean" :value="currentPage" @input="onPageInput" @blur="validatePage" />
                / {{ totalPages }}
            </span>
            <button type="button" @click="nextPage" :disabled="currentPage === totalPages">下一頁</button>
        </div>
    </main>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;

        createApp({
            setup() {
                const boards = ref([]);
                const loaded = ref(false);

                const { getAllBoards } = useBoardHelper();

                const {
                    pageSizeOptions,
                    pageSize,
                    currentPage,
                    totalPages,
                    pagedCards,
                    previousPage,
                    nextPage,
                    onPageInput,
                    validatePage
                } = window.usePageHelper(boards, 10);

                const formatTime = (value) => value ? new Date(value).toLocaleDateString() : '—';

                const createBoard = () => window.location.href = '/admin/board/create';

                const editBoard = (board) => window.location.href = `/admin/board/${board.id}/edit`;

                const toTimestamp = (value) => {
                    if (!value) return 0;
                    const ts = new Date(value).getTime();
                    return Number.isFinite(ts) ? ts : 0;
                };

                onMounted(async () => {
                    loaded.value = false;
                    try {
                        const allBoards = await getAllBoards();
                        const list = Array.isArray(allBoards) ? [...allBoards] : [];
                        boards.value = list.sort((a, b) => {
                            const topDiff = Number(Boolean(b?.isTop)) - Number(Boolean(a?.isTop));
                            if (topDiff !== 0) return topDiff;
                            return toTimestamp(b?.updatedAt) - toTimestamp(a?.updatedAt);
                        });
                    } catch (error) {
                        boards.value = [];
                        console.error('取得所有公告失敗', error);
                        Swal.fire({
                            icon: 'error',
                            title: '載入失敗',
                            text: error.response?.data?.message || '無法取得公告清單'
                        });
                    } finally {
                        loaded.value = true;
                    }
                });

                return {
                    boards,
                    loaded,
                    formatTime,
                    createBoard,
                    editBoard,
                    pageSizeOptions,
                    pageSize,
                    currentPage,
                    totalPages,
                    pagedCards,
                    previousPage,
                    nextPage,
                    onPageInput,
                    validatePage
                };
            }
        }).mount('#app');
    </script>

</body>

</html>
