spring.application.name=server_community_web
server.port=8080

# 資料庫連線配置 (SQLite)
app.data.directory=${user.dir}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${app.data.directory}/instance/config.db

app.decks.directory=${app.data.directory}/decks
app.cache.directory=${app.data.directory}/cache

# HikariCP - SQLite 相容設定
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
spring.sql.init.separator=@@

# JPA / Hibernate 配置
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true