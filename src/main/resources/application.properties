spring.application.name=card_search_web
server.port=8080

# 資料庫連線配置 (SQLite)
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:../instance/config.db

# User-uploaded deck files are stored alongside the workspace instance directory.
app.user-decks.storage-dir=../decks
app.cache.directory=../cache

# HikariCP - SQLite 相容設定
spring.datasource.hikari.maximum-pool-size=1
#spring.sql.init.mode=always

# JPA / Hibernate 配置
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true